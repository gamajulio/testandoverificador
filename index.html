<body>

<script>
    function gerarTabelaCompleta() {
        let tabela = [
            { limite: 1, valor: 7 }, { limite: 2, valor: 8 }, { limite: 3, valor: 10 }, { limite: 4, valor: 11 },
            { limite: 5, valor: 13 }, { limite: 6, valor: 14 }, { limite: 7, valor: 15 }, { limite: 8, valor: 17 },
            { limite: 9, valor: 18 }, { limite: 10, valor: 20 }, { limite: 11, valor: 21 }, { limite: 12, valor: 23 },
            { limite: 13, valor: 24 }, { limite: 14, valor: 26 }, { limite: 15, valor: 27 }, { limite: 16, valor: 28 },
            { limite: 17, valor: 30 }, { limite: 18, valor: 31 }, { limite: 19, valor: 33 }, { limite: 20, valor: 34 }
        ];
        
        let ultimoValor = 34;
        for (let km = 21; km <= 40; km++) {
            ultimoValor += 2;
            tabela.push({ limite: km, valor: ultimoValor });
        }
        return tabela;
    }

    const tabelaCompartilhada = gerarTabelaCompleta();

    const LOJAS_DADOS = {
        centro: {
            nome: "Loja Centro",
            nomeCurto: "Centro",
            lat: -7.120783231036084, 
            lon: -34.878187390267904,
            tabela: tabelaCompartilhada
        },
        manaira: {

            lat: -7.098603460169281,

        },
        mangabeira: {

            tabela: tabelaCompartilhada
        },
        bessa: {
            nome: "Loja Bessa",
            nomeCurto: "Bessa",
            lat: -7.064204184127133, 
            lon: -34.841690084166466,
            tabela: tabelaCompartilhada
        }
    };

    let map = null;
    let routingControl = null;

    document.addEventListener("DOMContentLoaded", function() {
        const inputEndereco = document.getElementById("endereco");
        const btnCalcular = document.getElementById("btnCalcular");

        localStorage.removeItem('zeny_historico_fretes');

        btnCalcular.addEventListener("click", () => iniciarCalculo());

        inputEndereco.addEventListener("keydown", function(event) {
            if (event.key === 'Enter' || event.keyCode === 13) {
                event.preventDefault();
                iniciarCalculo();
            }
        });
    });

    async function geocodificar(enderecoOriginal) {
        let enderecoTratado = enderecoOriginal
            .replace(/\b(av|av\.)\b/gi, "Avenida")
            .replace(/\b(r|r\.)\b/gi, "Rua")
            .replace(/\b(tr|trav\.)\b/gi, "Travessa")
            .trim();

        const temLocalidade = /joão pessoa|bayeux|santa rita|cabedelo|pb/i.test(enderecoTratado);
        const cidadeBusca = temLocalidade ? "" : ", João Pessoa";

        const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&countrycodes=br&q=` + encodeURIComponent(enderecoTratado + cidadeBusca);
        
        try {
            const resposta = await fetch(url, { headers: { 'User-Agent': 'CalculadoraFreteZeny/11.0' } });
            let dados = await resposta.json();
            
            if (dados && dados.length > 0) {
                const cidadesPermitidas = ['joão pessoa', 'bayeux', 'santa rita', 'cabedelo'];
                
                for (let item of dados) {
                    const addr = item.address || {};
                    const cidade = (addr.city || addr.town || addr.municipality || addr.city_district || '').toLowerCase();
                    
                    if (cidadesPermitidas.some(cidadeValida => cidade.includes(cidadeValida))) {
                        return { 
                            lat: parseFloat(item.lat), 
                            lon: parseFloat(item.lon),
                            nomeCompleto: item.display_name
                        };
                    }
                }
            }
            return null;
        } catch (e) {
            console.error("Erro na geocodificação:", e);
            return null;
        }
    }

    async function encontrarLojaMaisProxima(destino) {
        const chaves = Object.keys(LOJAS_DADOS);
        const promessas = chaves.map(async (chave) => {
            const loja = LOJAS_DADOS[chave];
            const url = `https://router.project-osrm.org/route/v1/driving/${loja.lon},${loja.lat};${destino.lon},${destino.lat}?overview=false`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.routes && data.routes.length > 0) {
                    return { chave, distancia: data.routes[0].distance };
                }
