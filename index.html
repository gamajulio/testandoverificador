<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Taxa de Entrega - Zeny</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { color: #333; text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        button { background-color: #28a745; color: white; border: none; padding: 12px 15px; width: 100%; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #94d3a2; cursor: not-allowed; }
        
        /* Lista de Autocompletar */
        #sugestoes { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc; border-top: none; border-radius: 0 0 4px 4px; z-index: 1000; max-height: 200px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: none; }
        .sugestao-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 14px; color: #333; }
        .sugestao-item:last-child { border-bottom: none; }
        .sugestao-item:hover { background-color: #f0f8ff; }

        /* Resultado e Botão Copiar */
        #resultado { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 4px; display: none; font-size: 16px; line-height: 1.5; }
        .btn-copiar { background-color: #25D366; color: white; margin-top: 12px; font-size: 15px; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-copiar:hover { background-color: #1ebe57; }
        
        /* Histórico Recente */
        #historico-container { margin-top: 15px; display: none; border-top: 1px solid #eee; padding-top: 10px; }
        .historico-titulo { font-size: 13px; color: #777; font-weight: bold; margin-bottom: 8px; }
        .historico-lista { display: flex; flex-wrap: wrap; gap: 6px; }
        .historico-chip { background: #f1f3f5; border: 1px solid #dee2e6; border-radius: 15px; padding: 5px 12px; font-size: 13px; color: #495057; cursor: pointer; transition: background 0.2s; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .historico-chip:hover { background: #e2e6ea; }

        #map { height: 350px; margin-top: 15px; border-radius: 4px; display: none; }
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Calculadora de Taxa de Entrega - Zeny</h2>
    
    <!-- Menu suspenso com opção automática -->
    <div class="form-group">
        <label for="lojaOrigem">Selecione a Loja de Origem:</label>
        <select id="lojaOrigem">
            <option value="auto">⚡ Automático (Loja Mais Próxima)</option>
            <option value="centro">Centro - Av. Camilo De Holanda, 19</option>
            <option value="manaira">Manaíra - Av. Gov. Flávio Ribeiro Coutinho, 805</option>
            <option value="mangabeira">Mangabeira - Av. Hilton Souto Maior, 3901</option>
            <option value="bessa">Bessa - Av. Pres. Afonso Pena, 1111</option>
        </select>
    </div>

    <div class="form-group">
        <label for="endereco">Endereço do Cliente (digite para sugestões ou aperte Enter):</label>
        <input type="text" id="endereco" autocomplete="off" placeholder="Ex: Av. Epitácio Pessoa, 500, João Pessoa">
        <div id="sugestoes"></div>
    </div>
    
    <button id="btnCalcular">Calcular Rota e Taxa</button>

    <!-- Histórico dos últimos 3 endereços -->
    <div id="historico-container">
        <div class="historico-titulo">🕒 Consultas recentes:</div>
        <div class="historico-lista" id="historico-lista"></div>
    </div>

    <div id="resultado"></div>
    <div id="map"></div>
</div>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<script>
    function gerarTabelaCompleta() {
        let tabela = [
            { limite: 1, valor: 7 }, { limite: 2, valor: 8 }, { limite: 3, valor: 10 }, { limite: 4, valor: 11 },
            { limite: 5, valor: 13 }, { limite: 6, valor: 14 }, { limite: 7, valor: 15 }, { limite: 8, valor: 17 },
            { limite: 9, valor: 18 }, { limite: 10, valor: 20 }, { limite: 11, valor: 21 }, { limite: 12, valor: 23 },
            { limite: 13, valor: 24 }, { limite: 14, valor: 26 }, { limite: 15, valor: 27 }, { limite: 16, valor: 28 },
            { limite: 17, valor: 30 }, { limite: 18, valor: 31 }, { limite: 19, valor: 33 }, { limite: 20, valor: 34 }
        ];
        
        let ultimoValor = 34;
        for (let km = 21; km <= 40; km++) {
            ultimoValor += 2;
            tabela.push({ limite: km, valor: ultimoValor });
        }
        return tabela;
    }

    const tabelaCompartilhada = gerarTabelaCompleta();

    const LOJAS_DADOS = {
        centro: {
            nome: "Loja Centro",
            nomeCurto: "Centro",
            lat: -7.120783231036084, 
            lon: -34.878187390267904,
            tabela: tabelaCompartilhada
        },
        manaira: {
            nome: "Loja Manaíra",
            nomeCurto: "Manaíra",
            lat: -7.098603460169281, 
            lon: -34.844245411037924,
            tabela: tabelaCompartilhada
        },
        mangabeira: {
            nome: "Loja Mangabeira",
            nomeCurto: "Mangabeira",
            lat: -7.163214354378254, 
            lon: -34.83076965795877,
            tabela: tabelaCompartilhada
        },
        bessa: {
            nome: "Loja Bessa",
            nomeCurto: "Bessa",
            lat: -7.064204184127133, 
            lon: -34.841690084166466,
            tabela: tabelaCompartilhada
        }
    };

    let map = null;
    let routingControl = null;
    let coordenadaSelecionadaAutocomplete = null;
    let timeoutAutocomplete = null;
    let historicoConsultas = JSON.parse(localStorage.getItem('zeny_historico_fretes') || '[]');

    document.addEventListener("DOMContentLoaded", function() {
        const inputEndereco = document.getElementById("endereco");
        const divSugestoes = document.getElementById("sugestoes");
        const btnCalcular = document.getElementById("btnCalcular");

        renderizarHistorico();

        btnCalcular.addEventListener("click", () => iniciarCalculo());

        inputEndereco.addEventListener("keydown", function(event) {
            if (event.key === 'Enter' || event.keyCode === 13) {
                event.preventDefault();
                divSugestoes.style.display = 'none';
                iniciarCalculo();
            }
        });

        // Autocompletar seguro utilizando a API Nominatim
        inputEndereco.addEventListener("input", function() {
            coordenadaSelecionadaAutocomplete = null;
            const termo = this.value.trim();
            clearTimeout(timeoutAutocomplete);

            if (termo.length < 4) {
                divSugestoes.style.display = 'none';
                return;
            }

            timeoutAutocomplete = setTimeout(async () => {
                try {
                    const query = termo.toLowerCase().includes('paraíba') ? termo : termo + ", Paraíba";
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=` + encodeURIComponent(query) + `&limit=5`;
                    const res = await fetch(url, { headers: { 'User-Agent': 'CalculadoraFreteZeny/3.0' } });
                    const dados = await res.json();

                    divSugestoes.innerHTML = '';
                    if (dados && dados.length > 0) {
                        dados.forEach(item => {
                            const div = document.createElement('div');
